<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="paired-latency-paired-title" font-family="system-ui,sans-serif"><title id="paired-latency-paired-title">Paired baseline and candidate latency by scenario</title><desc>Linked points compare the same scenario before and after. Lower milliseconds are faster. This example uses synthetic fixture data.</desc><rect width="960" height="350" fill="white" /><text x="220" y="28" font-size="15" fill="#63757b">Baseline</text><circle cx="205" cy="23" r="6" fill="#63757b" /><text x="390" y="28" font-size="15" fill="#17665c">Candidate</text><circle cx="375" cy="23" r="6" fill="#17665c" /><text x="24" y="80" font-size="16" fill="#273d45">Small batch</text><path d="M498.57142857142856 75H436.66666666666663" stroke="#b7c6c9" stroke-width="4" /><circle cx="498.57142857142856" cy="75" r="7" fill="#63757b" /><text x="498.57142857142856" y="60" text-anchor="middle" font-size="13" fill="#63757b">90</text><circle cx="436.66666666666663" cy="75" r="7" fill="#17665c" /><text x="436.66666666666663" y="60" text-anchor="middle" font-size="13" fill="#17665c">70</text><text x="24" y="145" font-size="16" fill="#273d45">Medium batch</text><path d="M653.3333333333333 140H514.047619047619" stroke="#b7c6c9" stroke-width="4" /><circle cx="653.3333333333333" cy="140" r="7" fill="#63757b" /><text x="653.3333333333333" y="125" text-anchor="middle" font-size="13" fill="#63757b">140</text><circle cx="514.047619047619" cy="140" r="7" fill="#17665c" /><text x="514.047619047619" y="125" text-anchor="middle" font-size="13" fill="#17665c">95</text><text x="24" y="210" font-size="16" fill="#273d45">Large batch</text><path d="M870.0 205H715.2380952380952" stroke="#b7c6c9" stroke-width="4" /><circle cx="870.0" cy="205" r="7" fill="#63757b" /><text x="870.0" y="190" text-anchor="middle" font-size="13" fill="#63757b">210</text><circle cx="715.2380952380952" cy="205" r="7" fill="#17665c" /><text x="715.2380952380952" y="190" text-anchor="middle" font-size="13" fill="#17665c">160</text><text x="220.0" y="305" text-anchor="middle" font-size="13" fill="#536876">0</text><text x="382.5" y="305" text-anchor="middle" font-size="13" fill="#536876">52.5</text><text x="545.0" y="305" text-anchor="middle" font-size="13" fill="#536876">105</text><text x="707.5" y="305" text-anchor="middle" font-size="13" fill="#536876">157.5</text><text x="870.0" y="305" text-anchor="middle" font-size="13" fill="#536876">210</text><text x="220" y="335" font-size="15" fill="#273d45">Latency (ms) · lower is faster</text></svg>