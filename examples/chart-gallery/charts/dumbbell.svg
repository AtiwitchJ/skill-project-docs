<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 245" role="img" aria-labelledby="chart-dumbbell-title" font-family="system-ui,sans-serif"><title id="chart-dumbbell-title">Dumbbell</title><desc>Linked points preserve the before/after pairing within each category without implying a time series.</desc><rect width="960" height="245" fill="white"/><path d="M210.000 65.000L210.000 165.000" stroke="#cbd7db" stroke-width="1" fill="none"/><text x="210.00" y="190.00" font-size="12" text-anchor="middle" fill="#273d45">8</text><path d="M375.000 65.000L375.000 165.000" stroke="#cbd7db" stroke-width="1" fill="none"/><text x="375.00" y="190.00" font-size="12" text-anchor="middle" fill="#273d45">11</text><path d="M540.000 65.000L540.000 165.000" stroke="#cbd7db" stroke-width="1" fill="none"/><text x="540.00" y="190.00" font-size="12" text-anchor="middle" fill="#273d45">14</text><path d="M705.000 65.000L705.000 165.000" stroke="#cbd7db" stroke-width="1" fill="none"/><text x="705.00" y="190.00" font-size="12" text-anchor="middle" fill="#273d45">17</text><path d="M870.000 65.000L870.000 165.000" stroke="#cbd7db" stroke-width="1" fill="none"/><text x="870.00" y="190.00" font-size="12" text-anchor="middle" fill="#273d45">20</text><text x="540.00" y="227.00" font-size="14" text-anchor="middle" fill="#273d45">Value (example units)</text><text x="210.00" y="25.00" font-size="14" text-anchor="start" fill="#273d45">before (gray) → after (green)</text><text x="195.00" y="94.00" font-size="13" text-anchor="end" fill="#273d45">Small</text><path d="M430.000 90.000L210.000 90.000" stroke="#b7c8cb" stroke-width="4" fill="none"/><circle cx="430.000" cy="90.000" r="6" fill="#63757b"><title>12</title></circle><circle cx="210.000" cy="90.000" r="6" fill="#17665c"><title>8</title></circle><text x="195.00" y="144.00" font-size="13" text-anchor="end" fill="#273d45">Large</text><path d="M870.000 140.000L540.000 140.000" stroke="#b7c8cb" stroke-width="4" fill="none"/><circle cx="870.000" cy="140.000" r="6" fill="#63757b"><title>20</title></circle><circle cx="540.000" cy="140.000" r="6" fill="#17665c"><title>14</title></circle></svg>